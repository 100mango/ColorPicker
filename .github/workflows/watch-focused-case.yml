name: One finite Watch heartbeat observation
'on':
  push:
    branches: [watch-copy-singlecase]
permissions:
  contents: read
concurrency:
  group: touchcolor-watch-focused
  cancel-in-progress: false
jobs:
  watch:
    name: TouchColor one 40mm heartbeat case
    if: ${{ github.repository == '100mango/ColorPicker' && github.ref == 'refs/heads/watch-copy-singlecase' && github.event_name == 'push' && github.event.created == false && github.event.deleted == false && github.event.forced == false && github.run_attempt == '1' }}
    runs-on: xcode-27
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
    - name: Start original clock and one compact evidence file
      timeout-minutes: 1
      shell: bash
      run: |
        python3 - <<'PYTHON'
        import json,os,time
        from pathlib import Path
        out=Path(os.environ['RUNNER_TEMP'])/'watch-heartbeat-evidence';out.mkdir(exist_ok=False)
        (out/'watch-heartbeat-evidence.json').write_text(json.dumps({'schema':1,'run_id':os.environ['GITHUB_RUN_ID'],'run_attempt':os.environ['GITHUB_RUN_ATTEMPT'],'requested_sha':os.environ['GITHUB_SHA'],'state':'bootstrap-only','product_qualified':False,'started_monotonic':time.monotonic(),'started_epoch':time.time()})+'\n')
        PYTHON
    - name: Check out exact reviewed-parent child
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      timeout-minutes: 1
      with:
        persist-credentials: false
        fetch-depth: 2
        ref: ${{ github.sha }}
    - name: Require exact source scope and stable toolchain
      id: source
      timeout-minutes: 2
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PYTHON'
        import json,os,re,subprocess,sys
        from pathlib import Path
        sys.path.insert(0,'scripts')
        from watch_heartbeat_case import BASE,CHANGES
        def need(value,reason):
            if not value:raise RuntimeError(reason)
        def git(*args):return subprocess.check_output(['git',*args],text=True,timeout=10).strip()
        sha=os.environ['GITHUB_SHA'];need(re.fullmatch('[0-9a-f]{40}',sha),'invalid sha')
        need(os.environ['GITHUB_REPOSITORY']=='100mango/ColorPicker' and os.environ['GITHUB_REF']=='refs/heads/watch-copy-singlecase','wrong repository/ref')
        need(os.environ['GITHUB_EVENT_NAME']=='push' and os.environ['GITHUB_RUN_ATTEMPT']=='1','push/first attempt only')
        event=json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text())
        need(event.get('created') is False and event.get('deleted') is False and event.get('forced') is False,'existing branch non-forced update only')
        need(os.environ['GITHUB_WORKFLOW_SHA']==sha and os.environ['GITHUB_WORKFLOW_REF']=='100mango/ColorPicker/.github/workflows/watch-focused-case.yml@refs/heads/watch-copy-singlecase','wrong workflow source')
        need(git('rev-parse','HEAD')==sha and git('rev-list','--parents','-n','1','HEAD').split()==[sha,BASE],'not exact parent child')
        need(not git('status','--porcelain=v1','--untracked-files=all'),'dirty source')
        changes=git('diff','--name-status','--no-renames',BASE,'HEAD','--').splitlines()
        need(sorted(changes)==CHANGES,'changed-path scope mismatch')
        path=Path(os.environ['RUNNER_TEMP'])/'watch-heartbeat-evidence/watch-heartbeat-evidence.json'
        report=json.loads(path.read_bytes());report['source_admission']={'sha':sha,'tree':git('rev-parse','HEAD^{tree}'),'parent':BASE,'changes':changes,'clean':True}
        path.write_text(json.dumps(report)+'\n')
        PYTHON
        host_build="$(sw_vers -buildVersion)"
        case "$host_build" in 26A428|26A434) ;; *) exit 1 ;; esac
        xcodebuild -version > "$RUNNER_TEMP/watch-heartbeat-xcode-version.txt"
        grep -Fx 'Xcode 27.0' "$RUNNER_TEMP/watch-heartbeat-xcode-version.txt"
        grep -Fx 'Build version 27A266a' "$RUNNER_TEMP/watch-heartbeat-xcode-version.txt"
        uname -m | grep -Fx arm64
    - name: Observe only the original case with finite App logging
      id: runtime
      timeout-minutes: 17
      shell: bash
      run: python3 scripts/watch_heartbeat_case.py
    - name: Validate one small evidence file
      id: evidence
      if: ${{ always() }}
      timeout-minutes: 3
      shell: bash
      run: |
        python3 - <<'PYTHON'
        import json,os,stat
        from pathlib import Path
        out=Path(os.environ['RUNNER_TEMP'])/'watch-heartbeat-evidence'
        files=list(out.iterdir())
        if len(files)!=1 or files[0].name!='watch-heartbeat-evidence.json':raise RuntimeError('unexpected evidence members')
        p=files[0];s=p.lstat()
        if p.is_symlink() or not stat.S_ISREG(s.st_mode) or s.st_nlink!=1 or s.st_size>65536:raise RuntimeError('unbounded evidence')
        data=p.read_bytes()
        if len(data)>65536:raise RuntimeError('changed evidence size')
        report=json.loads(data)
        if report.get('run_id')!=os.environ['GITHUB_RUN_ID'] or report.get('run_attempt')!=os.environ['GITHUB_RUN_ATTEMPT'] or report.get('requested_sha')!=os.environ['GITHUB_SHA']:raise RuntimeError('wrong evidence invocation')
        if report.get('product_qualified') is not False:raise RuntimeError('observation cannot qualify product release')
        PYTHON
    - name: Keep only compact diagnostic evidence
      if: ${{ always() && steps.evidence.outcome == 'success' }}
      timeout-minutes: 1
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: touchcolor-watch-heartbeat-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/watch-heartbeat-evidence/watch-heartbeat-evidence.json
        if-no-files-found: error
        retention-days: 7
    - name: Preserve real case and observation failures
      if: ${{ always() }}
      timeout-minutes: 1
      env:
        RUNTIME_OUTCOME: ${{ steps.runtime.outcome }}
        EVIDENCE_OUTCOME: ${{ steps.evidence.outcome }}
      run: |
        python3 - <<'PYTHON'
        import os,json
        from pathlib import Path
        r=json.loads((Path(os.environ['RUNNER_TEMP'])/'watch-heartbeat-evidence/watch-heartbeat-evidence.json').read_bytes())
        if os.environ['RUNTIME_OUTCOME']!='success' or os.environ['EVIDENCE_OUTCOME']!='success' or r.get('state')!='case-passed-observation-retained':raise SystemExit(1)
        PYTHON
