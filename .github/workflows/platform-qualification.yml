        env:
          MAC_EVIDENCE_COMPLETE: ${{ steps.evidence_guard.outputs.mac_evidence_complete }}
        run: test "$MAC_EVIDENCE_COMPLETE" = true
      - name: Require every deferred Vision result qualification
        if: ${{ always() && matrix.platform == 'vision' }}
        timeout-minutes: 1
        run: test '${{ steps.evidence_guard.outputs.vision_offline_qualified }}' = 'true'
      - name: Require complete exact native text row evidence
        if: ${{ always() && (matrix.platform == 'vision' || matrix.platform == 'watch') }}
        timeout-minutes: 1
        env:
          NATIVE_TEXT_EVIDENCE_COMPLETE: ${{ steps.evidence_guard.outputs.native_text_evidence_complete }}
        run: test "$NATIVE_TEXT_EVIDENCE_COMPLETE" = true
      - name: Require retained secondary About evidence
        if: ${{ always() && matrix.lane != 'tv-secondary-missing-screens' && (matrix.platform == 'mac' || matrix.platform == 'tv' || matrix.platform == 'watch' || matrix.platform == 'vision') }}
        timeout-minutes: 1
        env:
          SECONDARY_EVIDENCE_COMPLETE: ${{ steps.evidence_guard.outputs.secondary_evidence_complete }}
        run: test "$SECONDARY_EVIDENCE_COMPLETE" = true
      - name: Require exact TV host and xcresult runtime boundary
        if: ${{ always() && matrix.platform == 'tv' }}
        timeout-minutes: 1
        env:
          TV_RUNTIME_BOUNDARY_COMPLETE: ${{ steps.evidence_guard.outputs.tv_runtime_boundary_complete }}
        run: test "$TV_RUNTIME_BOUNDARY_COMPLETE" = true
      - name: Require four missing raw screenshots and four strict audits
        if: ${{ always() && matrix.lane == 'tv-secondary-missing-screens' }}
        timeout-minutes: 1
        env:
          TV_MISSING_EVIDENCE_COMPLETE: ${{ steps.evidence_guard.outputs.tv_missing_evidence_complete }}
        run: test "$TV_MISSING_EVIDENCE_COMPLETE" = true
