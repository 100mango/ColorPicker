name: Corrected TouchColor unsigned platform qualification (closed)
on:
  push:
    branches: [touchcolor-platform-qualification]
    paths: [.github/platform-qualification.json]
permissions:
  contents: read
concurrency:
  group: touchcolor-platform-qualification
  cancel-in-progress: false
jobs:
  native-platform:
    name: Unsigned ${{ matrix.lane || matrix.platform }} on a fresh standard VM
    # BEGIN LOCAL QUALIFICATION SELECTION
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/touchcolor-platform-qualification' }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - platform: tv
            minutes: 25
            evidence_bytes: 2000000
            lane: tv-secondary-missing-screens
    # END LOCAL QUALIFICATION SELECTION
    runs-on: xcode-27
    timeout-minutes: ${{ matrix.minutes }}
    env:
      TOUCHCOLOR_JOB_PLATFORM: ${{ matrix.platform }}
      TOUCHCOLOR_JOB_MINUTES: ${{ matrix.minutes }}
      TOUCHCOLOR_JOB_LANE: ${{ matrix.lane || matrix.platform }}
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
      TOUCHCOLOR_WATCH_PROFILE: ${{ matrix.watch_profile }}
      TOUCHCOLOR_TEXT_PHASE: ${{ matrix.text_phase }}
      TOUCHCOLOR_VISION_CASE: ${{ matrix.vision_case }}
      TOUCHCOLOR_EVIDENCE_LIMIT: ${{ matrix.evidence_bytes }}
    steps:
      - name: Start exact native job clock
        timeout-minutes: 1
        run: |
          python3 - <<'PY'
          import os,time
          with open(os.environ['GITHUB_ENV'],'a') as stream:
              stream.write('TOUCHCOLOR_JOB_STARTED_EPOCH='+str(time.time())+'\n')
              stream.write('TOUCHCOLOR_JOB_STARTED_MONOTONIC='+str(time.monotonic())+'\n')
          PY
      - name: Check out exact source
        timeout-minutes: 1
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 64
      - name: Verify exact corrected product and control binding
        timeout-minutes: 1
        run: python3 scripts/platform_qualification.py admit
      - name: Initialize exact row budget
        timeout-minutes: 1
        run: python3 scripts/job_budget.py initialize
      - name: Verify source and stable toolchain
        id: toolchain
        timeout-minutes: 2
        run: |
          set -euo pipefail
          python3 scripts/platform_qualification.py admit
          mkdir -p build
          cat > build/tv-host-boundary.py <<'TV_HOST_POLICY'
          """Exact TV host policy and independent simulator-result binding; no OS equivalence."""
          import datetime,hashlib,json,math,os,re,stat,sys
          from pathlib import Path
          
          PRODUCT='7c671f04e4d69884741a411851ae26083361c7f7'
          PAIRS={('27.0','26A428'),('27.0.1','26A434')}
          KEY='tv_host_runtime_boundary'
          STATE=Path('build/tv-host-preflight.json')
          DIAGNOSTIC='tv-secondary-missing-screens'
          METHODS=('TouchColorTVUITests/TVWorkflowTests/testRemoteColorEditorAndMenuReturn','TouchColorTVUITests/TVWorkflowTests/testChineseRemoteColorEditor')
          
          def require(ok,message):
              if not ok: raise ValueError(message)
          
          def load(path):
              info=path.lstat()
              require(stat.S_ISREG(info.st_mode) and info.st_nlink==1 and info.st_size<=5_000_000,'Unsafe/oversized runtime evidence')
              raw=path.read_bytes()
              def pairs(values):
                  result={}
                  for key,value in values:
                      require(key not in result,'Duplicate evidence key');result[key]=value
                  return result
              return json.loads(raw,object_pairs_hook=pairs,parse_constant=lambda _: (_ for _ in ()).throw(ValueError('Nonfinite evidence'))),raw
          
          def digest(raw): return hashlib.sha256(raw).hexdigest()
          def canonical(value): return json.dumps(value,sort_keys=True,separators=(',',':'),allow_nan=False).encode()
          def environment():
              sha=os.environ.get('GITHUB_SHA','')
              require(re.fullmatch('[0-9a-f]{40}',sha) and os.environ.get('GITHUB_WORKFLOW_SHA')==sha,'Control source mismatch')
              require(os.environ.get('GITHUB_REPOSITORY')=='100mango/ColorPicker' and os.environ.get('GITHUB_REF')=='refs/heads/touchcolor-platform-qualification','Wrong runtime route')
              require(os.environ.get('TOUCHCOLOR_JOB_PLATFORM')=='tv' and os.environ.get('TOUCHCOLOR_JOB_LANE') in ('tv',DIAGNOSTIC),'Only reviewed TV full/diagnostic rows are admitted')
              return sha
          
          def validate_host(record):
              require(set(record)=={'schema','control_sha','product_sha','host_version','host_build','architecture','host_os_equivalence_claim','run_id','run_attempt'},'Host record fields')
              require(type(record['schema']) is int and record['schema']==1 and record['control_sha']==environment() and record['product_sha']==PRODUCT,'Host/source binding')
              require((record['host_version'],record['host_build']) in PAIRS and record['architecture']=='arm64','Unapproved exact host pair/architecture')
              require(record['host_os_equivalence_claim'] is False,'Host equivalence must remain unclaimed')
              require(all(re.fullmatch('[1-9][0-9]*',record.get(k,'')) and record[k]==os.environ.get('GITHUB_'+k.upper()) for k in ('run_id','run_attempt')),'Host run binding')
          
          def preflight(probe=None):
              if probe is None:
                  sys.path.insert(0,'scripts')
                  from bounded_process import check_output
                  probe=lambda command:check_output(command,text=True,timeout=10).strip()
              record={'schema':1,'control_sha':environment(),'product_sha':PRODUCT,
                      'host_version':probe(['/usr/bin/sw_vers','-productVersion']),
                      'host_build':probe(['/usr/bin/sw_vers','-buildVersion']),
                      'architecture':probe(['/usr/bin/uname','-m']),'host_os_equivalence_claim':False,
                      'run_id':os.environ.get('GITHUB_RUN_ID',''),'run_attempt':os.environ.get('GITHUB_RUN_ATTEMPT','')}
              print('TV_ACTUAL_HOST_BOUNDARY',json.dumps(record,sort_keys=True))
              validate_host(record);require(not STATE.exists(),'Do not replace an earlier host observation')
              STATE.parent.mkdir(parents=True,exist_ok=True);STATE.write_text(json.dumps(record,indent=2)+'\n')
              return record
          
          def compiled_census():
              import xml.etree.ElementTree as ET
              S=Path('.')
              sha=lambda p:digest(p.read_bytes())
              project=S/'TouchColorTV.xcodeproj/project.pbxproj';scheme=S/'TouchColorTV.xcodeproj/xcshareddata/xcschemes/TouchColorTV.xcscheme'
              raw=project.read_text();objects=dict(re.findall(r'^\t\t"([A-F0-9]{24})" = \{\n(.*?)^\t\t\};',raw,re.M|re.S))
              def scalar(body,key):
               values=re.findall(r'^\t\t\t"'+re.escape(key)+r'" = "([^"\n]+)";',body,re.M)
               if len(values)!=1:raise ValueError('Ambiguous field '+key)
               return values[0]
              def array(body,key):
               found=re.findall(r'^\t\t\t"'+re.escape(key)+r'" = \(([^\n]*)\);',body,re.M)
               if len(found)!=1:raise ValueError('Ambiguous array '+key)
               return re.findall(r'"([A-F0-9]{24})"',found[0])
              expected=[];targets=[];source_records=[]
              for entry in ET.parse(scheme).findall('.//TestableReference'):
               if entry.get('skipped')!='NO':raise ValueError('Skipped scheme test target')
               ref=entry.find('BuildableReference');identity=ref.get('BlueprintIdentifier');name=ref.get('BlueprintName');target=objects[identity]
               if scalar(target,'isa')!='PBXNativeTarget' or scalar(target,'name')!=name:raise ValueError('Scheme/target identity mismatch')
               paths=[]
               for phase_id in array(target,'buildPhases'):
                phase=objects[phase_id]
                if scalar(phase,'isa')!='PBXSourcesBuildPhase':continue
                for build_id in array(phase,'files'):
                 build=objects[build_id];file_id=scalar(build,'fileRef');file=objects[file_id]
                 if scalar(file,'isa')!='PBXFileReference':raise ValueError('Unexpected source reference')
                 paths.append(scalar(file,'path'))
               for path in paths:
                text=(S/path).read_text();classes=list(re.finditer(r'(?m)^(?:@\w+ )?(?:final )?class (\w+): XCTestCase\s*\{',text))
                for n,klass in enumerate(classes):
                 start=klass.end();end=classes[n+1].start() if n+1<len(classes) else len(text)
                 for method in re.finditer(r'\bfunc (test\w+)\s*\(\s*\)',text[start:end]):
                  offset=start+method.start();expected.append({'identifier':name+'/'+klass[1]+'/'+method[1],'module':name})
                source_records.append({'path':path,'sha256':sha(S/path),'target':name})
               targets.append({'target':name,'blueprint_id':identity,'sources':paths,'test_count':sum(x['module']==name for x in expected)})
              ids=[x['identifier'] for x in expected]
              if len(ids)!=45 or len(set(ids))!=45:raise ValueError('Derived full test inventory is not exactly45 unique methods')
              return {'tests':sorted(ids),'hosted':sum(x['module']=='TouchColorTVTests' for x in expected),'ui':sum(x['module']=='TouchColorTVUITests' for x in expected),'project_sha256':sha(project),'scheme_sha256':sha(scheme),'source_files':source_records}
          
          def assess(host,runtime,summary,summary_raw):
              validate_host(host);sha=environment()
              diagnostic=os.environ['TOUCHCOLOR_JOB_LANE']==DIAGNOSTIC
              census=compiled_census()
              count=2 if diagnostic else len(census['tests'])
              expected=sorted(METHODS) if diagnostic else census['tests']
              require(runtime.get('sha')==sha and runtime.get('platform')=='tv' and runtime.get('result')=='passed','TV runtime source/result mismatch')
              require(runtime.get('runtime')=='com.apple.CoreSimulator.SimRuntime.tvOS-27-0','TV simulator runtime must remain27.0')
              require(runtime.get('photos_seed')=='passed' and not runtime.get('cleanup_unconfirmed') and not runtime.get('budget_incomplete') and not runtime.get('failures'),'TV prerequisites/cleanup incomplete')
              require(summary.get('result')=='Passed' and summary.get('testFailures')==[],'TV xcresult failed')
              for key,value in [('totalTestCount',count),('passedTests',count),('failedTests',0),('skippedTests',0),('expectedFailures',0)]:
                  require(type(summary.get(key)) is int and summary[key]==value,'Exact source-derived TV count and zero-skip summary required')
              configurations=summary.get('devicesAndConfigurations')
              require(isinstance(configurations,list) and len(configurations)==1,'One TV xcresult device required')
              for key,value in [('passedTests',count),('failedTests',0),('skippedTests',0),('expectedFailures',0)]:
                  require(type(configurations[0].get(key)) is int and configurations[0][key]==value,'TV device configuration counts mismatch')
              device=configurations[0]['device'];udid=runtime.get('device',{}).get('udid')
              require(isinstance(udid,str) and re.fullmatch('[0-9a-fA-F-]{36}',udid) and device.get('deviceId')==udid,'Runtime/xcresult device mismatch')
              require(device.get('platform')=='tvOS Simulator' and device.get('osVersion')=='27.0' and device.get('architecture')=='arm64','TV xcresult runtime mismatch')
              stages=[s for s in runtime.get('stages',[]) if s.get('command',[])[:2]==['xcodebuild','test-without-building']]
              require(len(stages)==1,'One complete TV test command required');stage=stages[0];command=stage['command']
              require(stage.get('exit')==0 and stage.get('started') is True and stage.get('process_group_gone') is True and stage.get('capture_reader_finished') is True,'TV test process not successful/clean')
              for flag,value in [('-scheme','TouchColorTV'),('-project','TouchColorTV.xcodeproj'),('-destination','platform=tvOS Simulator,id='+udid),('-resultBundlePath','build/tv-tests.xcresult')]:
                  require(command.count(flag)==1 and command[command.index(flag)+1]==value,'TV test destination/scheme/result mismatch')
              selected=[x for x in command if x.startswith(('-only-testing','-skip-testing'))]
              require(selected==['-only-testing:'+m for m in METHODS] if diagnostic else not selected,'Wrong explicit TV test scope')
              if diagnostic:
                  from tv_diagnostic_adapter import derivation
                  require(runtime.get('tv_diagnostic_execution')==derivation(),'Diagnostic source derivation mismatch')
              else: require('tv_diagnostic_execution' not in runtime,'Diagnostic cannot qualify full TV')
              start,finish=summary.get('startTime'),summary.get('finishTime')
              require(all(type(x) in (int,float) and math.isfinite(x) for x in (start,finish)) and start<=finish,'Invalid xcresult timestamps')
              began=datetime.datetime.fromisoformat(stage['started_at']);ended=datetime.datetime.fromisoformat(stage['finished_at'])
              require(began.tzinfo is not None and ended.tzinfo is not None and began.timestamp()<=start<=finish<=ended.timestamp(),'xcresult outside actual test command')
              return {'host':host,'summary_sha256':digest(summary_raw),'runtime_body_sha256':digest(canonical(runtime)),
                      'simulator':{'identifier':runtime['runtime'],'device_id':udid,'os_version':device['osVersion'],'platform':device['platform'],'architecture':device['architecture']},
                      'test_summary':{'total':count,'passed':count,'failed':0,'skipped':0,'expected_failures':0},
                      'scope':'missing-screenshot diagnostic only' if diagnostic else 'full compiled TV suite',
                      'source_census':census,'expected_selected_methods':expected,'host_os_equivalence_claim':False}
          
          def bind(root):
              root=Path(root);path=root/'tv-runtime.json'
              runtime,_=load(path) if path.exists() else ({'platform':'tv','sha':environment(),'result':'incomplete'},b'')
              require(KEY not in runtime,'Do not replace an earlier runtime binding')
              boundary={'schema':1,'complete':False,'host_os_equivalence_claim':False}
              try:
                  host,_=load(STATE);summary,raw=load(root/'tv-summary.json')
                  boundary.update(complete=True,binding=assess(host,runtime,summary,raw))
              except (ValueError,OSError,KeyError,TypeError,IndexError) as error:
                  boundary['reason']=str(error)[:256]
                  if STATE.is_file():
                      try: boundary['actual_host']=load(STATE)[0]
                      except (ValueError,OSError): pass
              runtime[KEY]=boundary;path.write_text(json.dumps(runtime,indent=2,allow_nan=False)+'\n')
              return boundary['complete']
          
          def complete(root):
              try:
                  root=Path(root);runtime,_=load(root/'tv-runtime.json');boundary=runtime.pop(KEY)
                  require(boundary.get('schema')==1 and boundary.get('complete') is True and boundary.get('host_os_equivalence_claim') is False,'Host/runtime binding incomplete')
                  host,_=load(STATE);summary,raw=load(root/'tv-summary.json')
                  return boundary=={'schema':1,'complete':True,'host_os_equivalence_claim':False,'binding':assess(host,runtime,summary,raw)}
              except (ValueError,OSError,KeyError,TypeError,IndexError): return False
          
          if __name__=='__main__':
              require(sys.argv[1:] in (['preflight'],['bind','build/evidence'],['check','build/evidence']),'Unknown runtime boundary command')
              if sys.argv[1]=='preflight':preflight()
              elif sys.argv[1]=='bind':print('TV_HOST_RESULT_BINDING',bind(sys.argv[2]))
              else:
                  value=complete(sys.argv[2]);print('TV_HOST_RESULT_COMPLETE',value)
                  if os.environ.get('GITHUB_OUTPUT'):
                      with open(os.environ['GITHUB_OUTPUT'],'a') as output:output.write('tv_runtime_boundary_complete='+str(value).lower()+'\n')
          TV_HOST_POLICY
          cat > build/tv_diagnostic_adapter.py <<'TV_DIAGNOSTIC_ADAPTER'
          """Exact control-owned two-method diagnostic copies; frozen product sources stay untouched."""
          import hashlib,json,os,sys
          from pathlib import Path
          DIAGNOSTIC='tv-secondary-missing-screens'
          METHODS=('TouchColorTVUITests/TVWorkflowTests/testRemoteColorEditorAndMenuReturn','TouchColorTVUITests/TVWorkflowTests/testChineseRemoteColorEditor')
          SOURCE_HASHES={'scripts/test_extra_platforms.py': 'd2322c5c1a0de7b1dbc35914584907e730885a42e026a83d7431fe98604f8d73', 'scripts/run_budgeted_step.py': '6b71272820881dfe8a52e42c6a77714bb39043f7c5c1876b28e796a0ee5387fc'}
          DRIVER=Path('build/tv-evidence-driver.py')
          WRAPPER=Path('build/tv-budgeted-step.py')
          def need(ok,message):
              if not ok: raise ValueError(message)
          def sha(raw):return hashlib.sha256(raw).hexdigest()
          def replacements():
              need(os.environ.get('TOUCHCOLOR_JOB_PLATFORM')=='tv' and os.environ.get('TOUCHCOLOR_JOB_LANE')==DIAGNOSTIC,'Wrong diagnostic route')
              originals={name:Path(name).read_bytes() for name in SOURCE_HASHES}
              need(all(sha(raw)==SOURCE_HASHES[name] for name,raw in originals.items()),'Frozen native driver/budget source mismatch')
              driver=originals['scripts/test_extra_platforms.py'].decode()
              old="        run(test_common+test_arguments+['-resultBundlePath','build/'+kind+'-tests.xcresult']+skip,660)"
              new="        from tv_diagnostic_adapter import derivation\n        if kind!='tv' or skip: raise ValueError('Diagnostic requires TV and successful Photos seed')\n        report['tv_diagnostic_execution']=derivation()\n        run(test_common+test_arguments+['-resultBundlePath','build/'+kind+'-tests.xcresult']+"+repr(['-only-testing:'+m for m in METHODS])+",660)"
              need(driver.count(old)==1,'TV native selection hunk changed');driver=driver.replace(old,new,1)
              prefix="import sys\nsys.path.insert(0,'scripts')\nfrom tv_diagnostic_adapter import verify_files\nverify_files()\n"
              driver=prefix+driver
              wrapper=originals['scripts/run_budgeted_step.py'].decode()
              old="expected='python3 scripts/test_paired_watch.py' if budget.record['platform']=='paired' else 'python3 scripts/test_extra_platforms.py '+budget.record['platform']"
              new="expected='python3 build/tv-evidence-driver.py tv' if budget.record['platform']=='tv' else ''"
              need(wrapper.count(old)==1,'Cleanup-driver admission hunk changed');wrapper=prefix+wrapper.replace(old,new,1)
              return {str(DRIVER):driver.encode(),str(WRAPPER):wrapper.encode()}
          def verify_files():
              for name,raw in replacements().items():
                  need(Path(name).read_bytes()==raw,'Derived diagnostic driver/budget bytes drifted')
          def derivation():
              outputs=replacements()
              return {'schema':1,'scope':'missing-screenshot diagnostic only','product_sha':'7c671f04e4d69884741a411851ae26083361c7f7','source_sha':os.environ.get('GITHUB_SHA'),
                      'selected_methods':list(METHODS),'expected_executed_tests':2,'hosted_tests_selected':0,'source_sha256':SOURCE_HASHES,
                      'derived_sha256':{name:sha(raw) for name,raw in outputs.items()},'all_original_clocks_reserves_cleanup_and_limits_preserved':True}
          def prepare():
              outputs=replacements()
              for name,raw in outputs.items():
                  path=Path(name);need(not path.exists(),'Do not overwrite derived native driver');path.parent.mkdir(exist_ok=True);path.write_bytes(raw)
              print('TV_EXPLICIT_DIAGNOSTIC_DERIVATION',json.dumps(derivation(),sort_keys=True))
          if __name__=='__main__':
              need(sys.argv[1:]==['prepare'],'Unknown diagnostic adapter action');prepare()
          TV_DIAGNOSTIC_ADAPTER
          cat > build/tv_missing_evidence.py <<'TV_MISSING_EVIDENCE'
          """Protect four missing raw attachments and four audits under the unchanged2MB diagnostic cap."""
          import copy,json,os,sys
          from pathlib import Path
          sys.path.insert(0,'scripts')
          import secondary_about_evidence as evidence
          from tv_diagnostic_adapter import DIAGNOSTIC,METHODS
          KEY='tv_missing_screenshot_evidence'
          TITLES=('Native TV secondary Privacy empty','Native TV secondary About populated','Native TV secondary About zh-normal','Native TV secondary Privacy zh-normal')
          HISTORY={'run_id': 37941182061, 'job_id': 113855658783, 'control_sha': 'e5d10fb1949f6483c807ef91d8f7f2850fae9738', 'control_tree': '71e370b89d4468121e4ffd51f100f6c1e5a8f06a', 'product_sha': '7c671f04e4d69884741a411851ae26083361c7f7', 'artifact_sha256': '0377f414839f8240131ca8b6ab531f1ae241d452ef5a1f9602f0383cb212e9b8', 'job_log_sha256': '252e4771c88014c247062278b11cfddcd641f2e54249d4842c54b4b4bb8972b4', 'native_summary': {'result': 'Passed', 'totalTestCount': 45, 'passedTests': 45, 'failedTests': 0, 'skippedTests': 0, 'expectedFailures': 0}, 'historical_ci_conclusion': 'failure; never retroactively green', 'retained_images': [{'title': 'Native TV secondary About empty', 'path': 'tv-screenshots/2DC1961C-F2AB-40E5-88C2-CA4FC96E2A27.jpeg', 'bytes': 185767, 'sha256': '60b4ade84dcc88c3149688db8378fa8a825ab5f606d593064f70fb19d5d583f7', 'retained': True, 'original_bytes_verified': True}, {'title': 'Native TV secondary Privacy populated', 'path': 'tv-screenshots/195A7899-9996-4D3A-82BF-D998270A0EA2.jpeg', 'bytes': 427966, 'sha256': 'eac811aba0a99af50bd0704f3b9b893653d2e643c9f8a3836f0a417cc4bccb68', 'retained': True, 'original_bytes_verified': True}, {'title': 'Native TV secondary About zh-public-largest', 'path': 'tv-screenshots/0AE81A25-51FD-4B72-98B9-12F0E8044D62.jpeg', 'bytes': 218569, 'sha256': '05e0ad8486a62e2063c0f2d83347a14f61f2039ca905f40140ad93ae9e23c781', 'retained': True, 'original_bytes_verified': True}, {'title': 'Native TV secondary Privacy zh-public-largest', 'path': 'tv-screenshots/2F67DAAE-AEFA-4147-9764-57D3D08C76AE.jpeg', 'bytes': 427810, 'sha256': '790c32176fe2c6312a68bd1c2f83c5a44b1bac366e9f5e53594419366705c16f', 'retained': True, 'original_bytes_verified': True}], 'full_functional_count': 45, 'visual_complete': False}
          need=evidence.require
          
          def route():
              need(os.environ.get('TOUCHCOLOR_JOB_PLATFORM')=='tv' and os.environ.get('TOUCHCOLOR_JOB_LANE')==DIAGNOSTIC,'Wrong missing-proof diagnostic route')
              bound=evidence.binding();need(os.environ.get('GITHUB_RUN_ID','').isdigit() and os.environ.get('GITHUB_RUN_ATTEMPT','').isdigit(),'Missing diagnostic run identity')
              return {'source_sha':bound['source_sha'],'product_sha':'7c671f04e4d69884741a411851ae26083361c7f7','run_id':os.environ['GITHUB_RUN_ID'],'run_attempt':os.environ['GITHUB_RUN_ATTEMPT'],'lane':DIAGNOSTIC,'evidence_bytes':2_000_000}
          
          def specs():return evidence.requirements(evidence.binding())
          def outcomes(root):
              raw=evidence.read(root/'tv-summary.json');summary=evidence.strict(raw)
              need(summary.get('result')=='Passed' and summary.get('testFailures')==[],'Diagnostic XCTest failed')
              for key,value in [('totalTestCount',2),('passedTests',2),('failedTests',0),('skippedTests',0),('expectedFailures',0)]:
                  need(type(summary.get(key)) is int and summary[key]==value,'Diagnostic requires exactly2 UI tests, no failures/skips')
              return raw
          
          def validate_items(root,record):
              expected=specs();wanted=[s for s in expected if s['title'] in TITLES];audit_specs=[s for s in expected if s['audit']]
              need([x['required'] for x in record['images']]==wanted and [x['required'] for x in record['audits']]==audit_specs,'Missing-proof requirement inventory changed')
              summary=outcomes(root)
              for row in record['images']+record['audits']:
                  item=row['item'];raw=evidence.current_item(root,item);need(raw is not None,'Mandatory raw attachment was deleted')
                  need(evidence.summary_passed(summary,item,'tv'),'Attachment source/device/time mismatch')
                  if row in record['images']:
                      need((raw.startswith(b'\xff\xd8') and raw.endswith(b'\xff\xd9')) or (raw.startswith(b'\x89PNG\r\n\x1a\n') and raw.endswith(b'\x00\x00\x00\x00IEND\xaeB`\x82')),'Invalid raw screenshot')
                  else:
                      need(len(raw)<=evidence.MAX_AUDIT,'Audit exceeds bounded text');value=evidence.strict(raw);spec=row['required'];klass,method=spec['method'].removesuffix('()').split('/')
                      names={'-['+klass+' '+method+']','-[TouchColorTVUITests.'+klass+' '+method+']'}
                      need(value=={'schema':1,'state':'secondary About '+spec['context'],'imageName':spec['title'],'testName':value.get('testName'),'outcome':'passed'} and type(value['schema']) is int and value['testName'] in names,'Strict About audit failed')
              for audit in record['audits']:
                  for image in record['images']:
                      if image['required']['title']==audit['required']['title']:
                          a=image['item']['attachment'];b=audit['item']['attachment']
