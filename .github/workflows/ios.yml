name: iOS 27 compatibility
on:
  push:
    branches: [codex/ios-modernization]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: touchcolor-ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compatibility:
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Verify exact tested commit
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_EVENT_NAME" == push || "$GITHUB_EVENT_NAME" == workflow_dispatch ]]
          test "$GITHUB_REPOSITORY" = 100mango/ColorPicker
          test "$GITHUB_REF" = refs/heads/codex/ios-modernization
          test "$GITHUB_WORKFLOW_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code HEAD --
          echo "Tested commit: $(git rev-parse HEAD)"
          echo "Tested tree: $(git rev-parse 'HEAD^{tree}')"
          shasum -a 256 .github/workflows/ios.yml
      - name: Record exact stable toolchain and simulators
        run: |
          sw_vers
          xcodebuild -version
          xcodebuild -showsdks
          xcrun simctl list runtimes
          xcrun simctl list devices available
          xcodebuild -version > /tmp/touchcolor-xcode.txt
          grep 'Xcode 27.0' /tmp/touchcolor-xcode.txt
          grep -F '27A266a' /tmp/touchcolor-xcode.txt
          xcodebuild -showsdks > /tmp/touchcolor-sdks.txt
          grep 'iphoneos27.0' /tmp/touchcolor-sdks.txt
      - name: Validate checked-in project and metadata
        run: |
          python3 scripts/generate_project.py
          git diff --exit-code -- TouchColor.xcodeproj
          plutil -lint ColorPicker/TouchColor-Info.plist ColorPicker/PrivacyInfo.xcprivacy
          xcodebuild -list -project TouchColor.xcodeproj
      - name: Build unsigned Release for physical iOS devices
        run: |
          set -o pipefail
          xcodebuild -project TouchColor.xcodeproj -scheme TouchColor -configuration Release -destination 'generic/platform=iOS' -derivedDataPath build/device CODE_SIGNING_ALLOWED=NO build
      - name: Record unsigned app framework inventory
        run: |
          python3 - <<'PYFRAMEWORKS'
          import json,plistlib
          from pathlib import Path
          app=Path('build/device/Build/Products/Release-iphoneos/TouchColor.app')
          assert (app/'TouchColor').is_file()
          metadata=plistlib.loads((app/'Info.plist').read_bytes())
          assert metadata['UIDeviceFamily']==[1], metadata['UIDeviceFamily']
          print(json.dumps({'supported_device_families':metadata['UIDeviceFamily'],'scope':'historical iPhone-only'}))
          directory=app/'Frameworks'
          entries=sorted(str(p.relative_to(app)) for p in directory.rglob('*')) if directory.is_dir() else []
          print(json.dumps({'app':'TouchColor.app','embedded_framework_directory_entries':entries}))
          PYFRAMEWORKS
          otool -L build/device/Build/Products/Release-iphoneos/TouchColor.app/TouchColor
      - name: Build simulator test products
        id: build-tests
        timeout-minutes: 8
        run: |
          xcodebuild -project TouchColor.xcodeproj -scheme TouchColor -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/simulator \
            build-for-testing
      - name: Warm up compact iPhone simulator
        id: warm-iphone-compact
        if: ${{ !cancelled() && steps.build-tests.outcome == 'success' }}
        timeout-minutes: 10
        run: bash scripts/test_simulators.sh iPhoneCompact prepare
      - name: Compact iPhone unit tests
        if: ${{ !cancelled() && steps.warm-iphone-compact.outcome == 'success' }}
        timeout-minutes: 8
        run: bash scripts/test_simulators.sh iPhoneCompact TouchColorTests
      - name: Compact iPhone UI tests and synthetic screenshots
        if: ${{ !cancelled() && steps.warm-iphone-compact.outcome == 'success' }}
        timeout-minutes: 12
        run: bash scripts/test_simulators.sh iPhoneCompact TouchColorUITests
      - name: Shut down compact iPhone simulator
        if: always()
        timeout-minutes: 2
        run: bash scripts/test_simulators.sh iPhoneCompact shutdown
      - name: Warm up large iPhone simulator
        id: warm-iphone-large
        if: ${{ !cancelled() && steps.build-tests.outcome == 'success' }}
        timeout-minutes: 10
        run: bash scripts/test_simulators.sh iPhoneLarge prepare
      - name: Large iPhone unit tests
        if: ${{ !cancelled() && steps.warm-iphone-large.outcome == 'success' }}
        timeout-minutes: 8
        run: bash scripts/test_simulators.sh iPhoneLarge TouchColorTests
      - name: Large iPhone UI tests
        if: ${{ !cancelled() && steps.warm-iphone-large.outcome == 'success' }}
        timeout-minutes: 12
        run: bash scripts/test_simulators.sh iPhoneLarge TouchColorUITests
      - name: Shut down large iPhone simulator
        if: always()
        timeout-minutes: 2
        run: bash scripts/test_simulators.sh iPhoneLarge shutdown
      - name: Always report test summaries and simulator diagnostics
        if: always()
        run: |
          xcrun simctl list devices
          find build -maxdepth 1 -name '*.xcresult' -print -exec xcrun xcresulttool get test-results summary --path {} \; || true
          find ~/Library/Logs/DiagnosticReports -maxdepth 1 -name 'TouchColor*' -print -exec tail -n 100 {} \; 2>/dev/null || true
      - name: Verify tested source stayed unchanged
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code HEAD --
          echo "Final tested tree: $(git rev-parse 'HEAD^{tree}')"
          shasum -a 256 .github/workflows/ios.yml
