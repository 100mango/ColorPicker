name: Combined UIKit import qualification
on:
  push:
    branches: [codex/platform-integration, codex/uikit-hosted-repair]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: touchcolor-ios-${{ github.ref }}
  cancel-in-progress: false
jobs:
  compile-prerequisites:
    name: Compile and verify combined UIKit prerequisites
    runs-on: xcode-27
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Verify exact prerequisite source and toolchain
        run: |
          set -euo pipefail
          [[ "$GITHUB_EVENT_NAME" == push || "$GITHUB_EVENT_NAME" == workflow_dispatch ]]
          test "$GITHUB_REPOSITORY" = 100mango/ColorPicker
          [[ "$GITHUB_REF" == refs/heads/codex/platform-integration || "$GITHUB_REF" == refs/heads/codex/uikit-hosted-repair ]]
          test "$GITHUB_WORKFLOW_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code HEAD --
          echo "Prerequisite commit: $(git rev-parse HEAD)"
          echo "Prerequisite tree: $(git rev-parse 'HEAD^{tree}')"
          shasum -a 256 .github/workflows/ios.yml
          sw_vers
          xcodebuild -version | tee /tmp/touchcolor-prerequisite-xcode.txt
          grep -Fx 'Xcode 27.0' /tmp/touchcolor-prerequisite-xcode.txt
          grep -Fx 'Build version 27A266a' /tmp/touchcolor-prerequisite-xcode.txt
          xcodebuild -showsdks > /tmp/touchcolor-prerequisite-sdks.txt
          cat /tmp/touchcolor-prerequisite-sdks.txt
          grep -F 'iphoneos27.0' /tmp/touchcolor-prerequisite-sdks.txt
          grep -F 'watchos27.0' /tmp/touchcolor-prerequisite-sdks.txt
      - name: Validate generated projects and bounded evidence helpers
        run: |
          python3 scripts/generate_project.py
          python3 scripts/generate_watch_project.py
          python3 scripts/generate_palette_fixture_project.py
          git diff --exit-code -- TouchColor.xcodeproj TouchColorWatch.xcodeproj TestFixtures
          plutil -lint ColorPicker/TouchColor-Info.plist ColorPicker/PrivacyInfo.xcprivacy
          python3 scripts/verify_privacy_manifest.py ColorPicker/PrivacyInfo.xcprivacy selected
          python3 -m unittest discover -s scripts -p test_decode_log_screenshots.py
          python3 -m unittest discover -s scripts -p test_export_audit_evidence.py
          PYTHONPATH=scripts python3 -m unittest test_uikit_runtime_diagnostics test_palette_lifecycle_diagnostics test_uikit_picker_geometry test_uikit_warmup test_uikit_managed_device test_uikit_managed_tests test_uikit_palette_readiness test_uikit_fixture_handoff
          xcodebuild -list -project TouchColor.xcodeproj
      - name: Compile and test shared packages
        timeout-minutes: 6
        run: swift test --package-path Packages/ColorCore
      - name: Build and inspect actual unsigned Release products
        timeout-minutes: 8
        run: |
          set -euo pipefail
          xcodebuild -project TouchColor.xcodeproj -scheme TouchColor -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build/device CODE_SIGNING_ALLOWED=NO build
          python3 scripts/verify_embedded_watch.py build/device/Build/Products/Release-iphoneos/TouchColor.app device
          python3 - <<'PY'
          import plistlib
          from pathlib import Path
          app=Path('build/device/Build/Products/Release-iphoneos/TouchColor.app')
          info=plistlib.loads((app/'Info.plist').read_bytes())
          if info['UIDeviceFamily'] != [1,2] or info.get('UIFileSharingEnabled') or info.get('LSSupportsOpeningDocumentsInPlace'):
              raise SystemExit('Release platform or document-sharing settings changed')
          if list(app.rglob('*PaletteFixtures*')):
              raise SystemExit('Synthetic fixture host leaked into Release')
          PY
      - name: Build original hosted UI audit and paired simulator test products
        timeout-minutes: 8
        run: |
          set -euo pipefail
          xcodebuild -project TouchColor.xcodeproj -scheme TouchColor -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/simulator build-for-testing
          python3 scripts/verify_embedded_watch.py build/simulator/Build/Products/Debug-iphonesimulator/TouchColor.app simulator --debug --build-for-testing
          test -f build/simulator/Build/Products/Debug-iphonesimulator/TouchColor.app/PlugIns/TouchColorTests.xctest/TouchColorTests
          test -f build/simulator/Build/Products/Debug-iphonesimulator/TouchColorUITests-Runner.app/PlugIns/TouchColorUITests.xctest/TouchColorUITests
          strings build/simulator/Build/Products/Debug-iphonesimulator/TouchColorUITests-Runner.app/PlugIns/TouchColorUITests.xctest/TouchColorUITests > /tmp/touchcolor-prerequisite-ui-classes.txt
          for class in TouchColorUITests TouchColorIPadUITests TouchColorAccessibilityUITests PhonePairedTransferTests; do
            grep -F "$class" /tmp/touchcolor-prerequisite-ui-classes.txt
          done
      - name: Build separate synthetic palette fixture host
        timeout-minutes: 4
        run: |
          xcodebuild -project TestFixtures/PaletteFixtures.xcodeproj -scheme PaletteFixtures -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/palette-fixtures CODE_SIGNING_ALLOWED=NO build
          test -f build/palette-fixtures/Build/Products/Debug-iphonesimulator/PaletteFixtures.app/PaletteFixtures
      - name: Verify prerequisite source stayed unchanged
        if: always()
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code HEAD --
          echo "Final prerequisite tree: $(git rev-parse 'HEAD^{tree}')"
          shasum -a 256 .github/workflows/ios.yml
  compatibility:
    needs: compile-prerequisites
    name: ${{ matrix.family }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        family: [iPadMini, iPadLarge, iPhoneCompact, iPhoneLarge]
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      TC_TEST_FAMILY: ${{ matrix.family }}
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Verify exact tested commit
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_EVENT_NAME" == push || "$GITHUB_EVENT_NAME" == workflow_dispatch ]]
          test "$GITHUB_REPOSITORY" = 100mango/ColorPicker
          [[ "$GITHUB_REF" == refs/heads/codex/platform-integration || "$GITHUB_REF" == refs/heads/codex/uikit-hosted-repair ]]
          test "$GITHUB_WORKFLOW_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code HEAD --
          echo "Tested commit: $(git rev-parse HEAD)"
          echo "Tested tree: $(git rev-parse 'HEAD^{tree}')"
          shasum -a 256 .github/workflows/ios.yml
      - name: Record exact stable toolchain and simulators
        run: |
          sw_vers
          xcodebuild -version
          xcodebuild -showsdks
          xcrun simctl list runtimes
          xcrun simctl list devices available
          xcrun simctl list devicetypes -j
          xcrun simctl help privacy
          xcodebuild -version > /tmp/touchcolor-xcode.txt
          grep 'Xcode 27.0' /tmp/touchcolor-xcode.txt
          grep -F '27A266a' /tmp/touchcolor-xcode.txt
          xcodebuild -showsdks > /tmp/touchcolor-sdks.txt
          grep 'iphoneos27.0' /tmp/touchcolor-sdks.txt
      - name: Validate checked-in project and metadata
        run: |
          python3 scripts/generate_project.py
          python3 scripts/generate_watch_project.py
          git diff --exit-code -- TouchColor.xcodeproj TouchColorWatch.xcodeproj
          python3 scripts/generate_palette_fixture_project.py
          git diff --exit-code -- TestFixtures
          plutil -lint ColorPicker/TouchColor-Info.plist ColorPicker/PrivacyInfo.xcprivacy
          python3 scripts/verify_privacy_manifest.py ColorPicker/PrivacyInfo.xcprivacy selected
          python3 -m unittest discover -s scripts -p test_decode_log_screenshots.py
          PYTHONPATH=scripts python3 -m unittest test_uikit_runtime_diagnostics test_palette_lifecycle_diagnostics
          xcodebuild -list -project TouchColor.xcodeproj
      - name: Shared domain raster and legacy palette tests
        timeout-minutes: 6
        run: swift test --package-path Packages/ColorCore
      - name: Build unsigned Release for physical iOS devices
        run: |
          set -o pipefail
          xcodebuild -project TouchColor.xcodeproj -scheme TouchColor -configuration Release -destination 'generic/platform=iOS' -derivedDataPath build/device CODE_SIGNING_ALLOWED=NO build
          python3 scripts/verify_embedded_watch.py build/device/Build/Products/Release-iphoneos/TouchColor.app device
      - name: Analyze production Objective-C source
        timeout-minutes: 5
        run: |
          set -o pipefail
          xcodebuild -project TouchColor.xcodeproj -scheme TouchColor -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build/device \
            CODE_SIGNING_ALLOWED=NO CLANG_ANALYZER_OUTPUT=plist analyze
      - name: Record unsigned app framework inventory
        run: |
          python3 - <<'PYFRAMEWORKS'
          import json,plistlib
          from pathlib import Path
          app=Path('build/device/Build/Products/Release-iphoneos/TouchColor.app')
          assert (app/'TouchColor').is_file()
          metadata=plistlib.loads((app/'Info.plist').read_bytes())
          assert metadata['UIDeviceFamily']==[1,2], metadata['UIDeviceFamily']
          assert not metadata.get('UIFileSharingEnabled')
          assert not metadata.get('LSSupportsOpeningDocumentsInPlace')
          assert not list(app.rglob('*PaletteFixtures*')), 'Fixture host must not be in Release packaging'
          assert 'PaletteFixtures' not in Path('TouchColor.xcodeproj/project.pbxproj').read_text()
          print(json.dumps({'supported_device_families':metadata['UIDeviceFamily'],'scope':'native iPhone and iPad'}))
          directory=app/'Frameworks'
          entries=sorted(str(p.relative_to(app)) for p in directory.rglob('*')) if directory.is_dir() else []
          print(json.dumps({'app':'TouchColor.app','embedded_framework_directory_entries':entries}))
          PYFRAMEWORKS
          otool -L build/device/Build/Products/Release-iphoneos/TouchColor.app/TouchColor
          strings build/device/Build/Products/Release-iphoneos/TouchColor.app/TouchColor > /tmp/touchcolor-release-strings.txt
          if grep -E -- '--ui-test-' /tmp/touchcolor-release-strings.txt; then
            echo 'Test-only seams leaked into Release'; exit 1
          fi
      - name: Build simulator test products
        id: build-tests
        timeout-minutes: 8
        run: |
          xcodebuild -project TouchColor.xcodeproj -scheme TouchColor -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/simulator \
            build-for-testing
      - name: Build independent simulator-only palette fixture host
        id: build-fixture
        timeout-minutes: 4
        run: |
          xcodebuild -project TestFixtures/PaletteFixtures.xcodeproj -scheme PaletteFixtures -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/palette-fixtures \
            CODE_SIGNING_ALLOWED=NO build
      - name: Configure fresh owned simulator destination
        id: warm-device
        if: ${{ !cancelled() && steps.build-tests.outcome == 'success' && steps.build-fixture.outcome == 'success' }}
        timeout-minutes: 10
        run: bash scripts/test_simulators.sh "$TC_TEST_FAMILY" configure
      - name: Unit and constrained-window layout tests
        id: hosted-tests
        if: ${{ !cancelled() && steps.warm-device.outcome == 'success' }}
        timeout-minutes: 10
        run: bash scripts/test_simulators.sh "$TC_TEST_FAMILY" managed-hosted
      - name: Prepare Files fixture and seed synthetic photo
        id: seed-device
        if: ${{ !cancelled() && steps.hosted-tests.outcome == 'success' }}
        timeout-minutes: 10
        run: bash scripts/test_simulators.sh "$TC_TEST_FAMILY" fixture-seed
      - name: Functional UI tests
        id: functional-tests
        if: ${{ !cancelled() && steps.seed-device.outcome == 'success' }}
        timeout-minutes: 20
        run: bash scripts/test_simulators.sh "$TC_TEST_FAMILY" managed-functional
      - name: Read bounded app and Files-service metadata after a functional failure
        id: runtime-diagnostics
        if: ${{ !cancelled() && steps.functional-tests.outcome == 'failure' }}
        timeout-minutes: 2
        run: python3 scripts/uikit_runtime_diagnostics.py "$TC_TEST_FAMILY"
      - name: Official XCTest accessibility audits
        if: ${{ !cancelled() && steps.seed-device.outcome == 'success' && (steps.runtime-diagnostics.outcome == 'skipped' || steps.runtime-diagnostics.outputs.simulator_safe == 'true') }}
        timeout-minutes: 12
        run: bash scripts/test_simulators.sh "$TC_TEST_FAMILY" managed-audits
      - name: Shut down simulator
        if: ${{ always() && steps.warm-device.outcome != 'skipped' && (steps.runtime-diagnostics.outcome == 'skipped' || steps.runtime-diagnostics.outputs.simulator_safe == 'true') }}
        timeout-minutes: 2
        run: bash scripts/test_simulators.sh "$TC_TEST_FAMILY" managed-shutdown
      - name: Export bounded device evidence
        if: always()
        timeout-minutes: 3
        run: python3 scripts/export_audit_failures.py
      - name: Always report test summaries and simulator diagnostics
        if: always()
        run: |
          vm_stat
          tc_report_status=0
          python3 scripts/uikit_warmup.py "$TC_TEST_FAMILY" report || tc_report_status=$?
          find build -maxdepth 1 -name '*.xcresult' -print -exec xcrun xcresulttool get test-results summary --path {} \; || true
          find ~/Library/Logs/DiagnosticReports -maxdepth 1 -name 'TouchColor*' -print -exec tail -n 100 {} \; 2>/dev/null || true
          exit "$tc_report_status"
      - name: Verify tested source stayed unchanged
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code HEAD --
          echo "Final tested tree: $(git rev-parse 'HEAD^{tree}')"
          shasum -a 256 .github/workflows/ios.yml
